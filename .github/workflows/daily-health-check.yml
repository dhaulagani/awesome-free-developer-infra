name: Daily Free Tier Health & Latency Monitor

on:
  schedule:
    - cron: "0 4 * * *" # Every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verification probe
        run: |
          python -c "
          import urllib.request, json, time
          with open('data/services.json') as f:
              services = json.load(f)
          print(f'Checking {len(services)} services...')
          for s in services:
              url = s.get('check_url', s['url'])
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Autonomous-HealthCheck/1.0'})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      lat = int((time.time() - start) * 1000)
                      s['health'] = {'status': 'ONLINE', 'latency_ms': lat, 'badge': f'![Online](https://img.shields.io/badge/Status-Online-3fb950?style=flat-square) `⚡ {lat}ms`'}
              except Exception:
                  pass
          with open('data/services.json', 'w') as f:
              json.dump(services, f, indent=2)
          "

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/services.json
          git diff --staged --quiet || git commit -m "chore(monitor): daily automated health-check update"
          git push
